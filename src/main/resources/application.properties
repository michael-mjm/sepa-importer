spring.application.name=sepa-importer

# Server
server.port=8080

# Datenbank
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SepaImportDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=YourPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# File Upload
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.servlet.multipart.location=./uploads/

# Logging
logging.level.org.springframework.batch=INFO
logging.level.com.sps.ids.sepa_importer=DEBUG

# Actuator Endpoints (Spring Boot 3.x - keine individuelle Enable-Konfiguration nötig)
management.endpoints.web.exposure.include=batch,health,info,metrics,prometheus
management.endpoint.health.show-details=always

# SEPA Import Pfad (kann via Job-Parameter überschrieben werden)
sepa.import.filePath=C:/data/STRUCTURES-SEPAD-V1-F-2026-01-07.xml

# Upload Verzeichnis
sepa.upload.directory=./uploads

# Jackson Konfiguration
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false